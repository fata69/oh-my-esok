name: Verify Android source

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Source checks
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.50.0'
          channel: stable
          # Untrusted PR code never shares a toolchain cache with a signing job.
          cache: false
      - name: Toolchain versions
        run: |
          flutter --version
          java -version
      - run: flutter pub get --enforce-lockfile
      - run: flutter analyze --no-pub
      - run: flutter test --no-pub --reporter expanded
      # Deliberately no signing environment, key restore, APK publication,
      # contents:write token, pull_request_target or privileged workflow_run.
