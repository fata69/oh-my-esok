name: Android candidate

on:
  pull_request:
  push:
    branches: [main, 'release/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.50.0'
          channel: stable
          cache: true
      - name: Toolchain versions
        run: |
          flutter --version
          java -version
      - run: flutter pub get --enforce-lockfile
      - run: flutter analyze
      - run: flutter test --reporter expanded
      - name: Install Android platform
        if: github.event_name != 'pull_request' && github.repository == 'fata69/oh-my-esok'
        run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0'
      - name: Restore signing key
        if: github.event_name != 'pull_request' && github.repository == 'fata69/oh-my-esok'
        env:
          KEYSTORE_BASE64: ${{ secrets.OH_MY_ESOK_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo 'Release keystore secret is required.'; exit 1; }
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/oh-my-esok.jks"
          chmod 600 "$RUNNER_TEMP/oh-my-esok.jks"
      - name: Build signed universal candidate
        if: github.event_name != 'pull_request' && github.repository == 'fata69/oh-my-esok'
        env:
          OH_MY_ESOK_KEYSTORE: ${{ runner.temp }}/oh-my-esok.jks
          OH_MY_ESOK_STORE_PASSWORD: ${{ secrets.OH_MY_ESOK_STORE_PASSWORD }}
          OH_MY_ESOK_KEY_ALIAS: ${{ secrets.OH_MY_ESOK_KEY_ALIAS }}
          OH_MY_ESOK_KEY_PASSWORD: ${{ secrets.OH_MY_ESOK_KEY_PASSWORD }}
        run: flutter build apk --release
      - name: Prepare candidate assets
        if: github.event_name != 'pull_request' && github.repository == 'fata69/oh-my-esok'
        run: |
          python3 scripts/release_metadata.py --apk build/app/outputs/flutter-apk/app-release.apk --output dist --aapt "$ANDROID_HOME/build-tools/36.0.0/aapt" --apksigner "$ANDROID_HOME/build-tools/36.0.0/apksigner"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: github.event_name != 'pull_request' && github.repository == 'fata69/oh-my-esok'
        with:
          name: android-candidate-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
      - name: Remove runner signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/oh-my-esok.jks"
